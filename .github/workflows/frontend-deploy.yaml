name: Deploy frontend

on:
  push:
    branches: ["main"]
    paths: ["frontend/**"]

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create .env.dev
        working-directory: .
        run: |
          cat > .env.dev <<EOF
          API_KEY=${{ secrets.TMDB_API_KEY }}
          SECRET=ci-secret
          EOF

      - name: Start dev stack
        working-directory: .
        run: docker compose -f docker-compose.dev.yml up -d --build --wait

      - name: Wait for API
        run: npx wait-on -t 120000 http-get://localhost:8080/api/movies/550

      - name: Seed test user
        run: |
          curl -fsS -X POST http://localhost:8080/api/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"tester","password":"tester"}'

      - name: Run Cypress e2e tests
        run: |
          docker run --rm --network host \
            -v "$PWD":/e2e -w /e2e \
            -e CYPRESS_baseUrl=http://localhost:8080 \
            cypress/included:12.17.2

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Dump dev stack logs
        if: failure()
        working-directory: .
        run: docker compose -f docker-compose.dev.yml logs --no-color

      - name: Stop dev stack
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.dev.yml down -v

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Deploy frontend
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK_URL_FRONTEND }}
